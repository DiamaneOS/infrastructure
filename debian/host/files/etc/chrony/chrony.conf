# SPDX-License-Identifier: MIT
# NTS sources from separate operators; no public NTP or command listener.
# Poll at most every 64 seconds so missed measurements do not routinely
# exhaust the HTTPS time monitor's five-minute source freshness window.
server time.cloudflare.com iburst nts maxpoll 6
server ntppool1.time.nl iburst nts maxpoll 6
server nts.netnod.se iburst nts maxpoll 6
server ptbtime1.ptb.de iburst nts maxpoll 6
server time.dfm.dk iburst nts maxpoll 6
server ntp3.fau.de iburst nts maxpoll 6

minsources 3
authselectmode require

# EF
dscp 46

driftfile /var/lib/chrony/drift
dumpdir /var/lib/chrony
ntsdumpdir /var/lib/chrony

leapseclist /usr/share/zoneinfo/leap-seconds.list
makestep 1.0 3

rtconutc
rtcsync

# The separate clock-readiness UID can read health but cannot use privileged
# chrony commands. Selected sources are authenticated by authselectmode require.
bindcmdaddress 127.0.0.1

noclientlog

port 0
