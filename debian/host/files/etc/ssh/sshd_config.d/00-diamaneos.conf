# SPDX-License-Identifier: Apache-2.0
# Requires a separate successful key-only login with non-root sudo access.
# OpenSSH uses the first value: load before the provider's cloud-init fragment.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# Match the upstream hybrid exchange and AEAD cipher policy. FIDO2 Ed25519
# authentication remains available for operators using hardware-backed keys.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
KexAlgorithms mlkem768x25519-sha256
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com
Ciphers aes256-gcm@openssh.com
MACs -*
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
