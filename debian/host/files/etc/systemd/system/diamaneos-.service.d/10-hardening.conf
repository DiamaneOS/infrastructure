# Shared sandbox for DiamaneOS workers. Per-service files declare only their
# UID, listeners, writable state and any narrowly required capability.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
CapabilityBoundingSet=
InaccessiblePaths=-/etc/letsencrypt -/etc/ssh -/etc/wireguard -/etc/diamaneos/host.json -/etc/diamaneos/management.nft
InaccessiblePaths=-/run/dbus/system_bus_socket -/run/systemd/resolve/io.systemd.Resolve -/run/systemd/resolve/io.systemd.Resolve.Monitor -/run/nscd/socket
# Public workers need no host-administration IPC, including root workers with
# a narrow capability set. Keep resolved's ordinary resolver files visible.
InaccessiblePaths=-/run/systemd/private -/run/systemd/io.systemd.Credentials -/run/systemd/io.systemd.Hostname -/run/systemd/io.systemd.ManagedOOM -/run/systemd/io.systemd.sysext
InaccessiblePaths=-/run/systemd/netif -/run/systemd/userdb -/run/systemd/journal -/run/systemd/ask-password -/run/udev/control -/run/ssh-unix-local
LimitCORE=0
