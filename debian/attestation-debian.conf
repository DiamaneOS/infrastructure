# SPDX-License-Identifier: Apache-2.0
[Unit]
After=diamaneos-egress.service
Requires=diamaneos-egress.service

[Service]
StateDirectory=attestation
StateDirectoryMode=0700
# The per-UID firewall permits local DNS and configured SMTP destinations.
# BPF's numeric address list cannot follow the provider's DNS rotation.
IPAddressDeny=
IPAddressAllow=
ReadOnlyPaths=/opt/attestation
InaccessiblePaths=-/etc/ssh -/etc/wireguard -/etc/letsencrypt -/etc/diamaneos
InaccessiblePaths=-/run/dbus/system_bus_socket -/run/systemd/private -/run/systemd/resolve/io.systemd.Resolve -/run/systemd/resolve/io.systemd.Resolve.Monitor -/run/nscd/socket -/run/udev/control -/run/ssh-unix-local
LimitCORE=0
MemoryMax=1G
TasksMax=256
LimitNOFILE=4096

# SyslogLevel is a default priority, not an output filter.
LogLevelMax=crit
