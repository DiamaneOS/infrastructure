[Unit]
BindsTo=var-lib-attestation.mount
After=var-lib-attestation.mount
ConditionPathIsMountPoint=/var/lib/attestation

[Service]
# Never create or chown a plaintext fallback beneath the locked mount.
StateDirectory=
ExecStartPre=/usr/bin/findmnt --noheadings --source /dev/mapper/diamaneos-attestation-state --mountpoint /var/lib/attestation
