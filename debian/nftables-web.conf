#!/usr/sbin/nft -f
# SPDX-License-Identifier: Apache-2.0
# Web role policy, rendered by activate-web-firewall. The per-source caps and
# synproxy follow GrapheneOS etc/nftables/nftables-network.conf.
destroy table inet filter
table inet filter {
    counter per_source_rejects {}
    counter synproxy_syns {}

    set ip-connlimit-main {
        type ipv4_addr
        flags dynamic
    }

    set ip6-connlimit-main {
        type ipv6_addr
        flags dynamic
    }

    chain prerouting-raw {
        type filter hook prerouting priority raw; policy accept;
        # Tunnel packets from any source would otherwise fill the connection table.
        udp dport {{wireguard_port}} notrack accept
        # New connections above this rate go through synproxy, so a SYN flood cannot fill the table.
        tcp dport { {{tcp_ports}} } tcp flags syn limit rate over {{synproxy_threshold}}/second burst {{synproxy_threshold}} packets counter name "synproxy_syns" notrack
    }

    chain input {
        type filter hook input priority filter; policy drop;
        iifname != "wg-mgmt" tcp dport { {{tcp_ports}} } goto input-web
        ct state established,related accept
        ct state invalid drop
        iif lo accept
        include "/etc/diamaneos/management.nft"
        udp dport {{wireguard_port}} ct state untracked accept
        meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
        # Keep path MTU and error signalling working. Discovery is link-local, and
        # routed packets cannot legitimately arrive with hop limit 255.
        meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 20/second accept
        meta l4proto ipv6-icmp ip6 hoplimit 255 ip6 saddr fe80::/10 icmpv6 type nd-router-advert accept
        meta l4proto ipv6-icmp ip6 hoplimit 255 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } accept
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
    }

    chain input-web {
        iif lo goto input-web-loopback

        # For synproxy the SYN is untracked and the first ACK is invalid. Both fall through.
        ct state vmap { established : goto input-web-established, related : accept, new : goto input-web-new }

        ip saddr @ip-connlimit-main counter name "per_source_rejects" reject with tcp reset
        ip6 saddr and ffff:ffff:ffff:ffff:: @ip6-connlimit-main counter name "per_source_rejects" reject with tcp reset
        synproxy mss 1460 wscale 7 timestamp sack-perm
    }

    chain input-web-new {
        ip saddr @ip-connlimit-main counter name "per_source_rejects" reject with tcp reset
        ip6 saddr and ffff:ffff:ffff:ffff:: @ip6-connlimit-main counter name "per_source_rejects" reject with tcp reset
        accept
    }

    # Count connections established without synproxy: 32 per IPv4 address or IPv6 /64.
    chain input-web-established {
        ct mark 0x1 accept
        add @ip-connlimit-main { ip saddr ct count over 32 } counter name "per_source_rejects" reject with tcp reset
        add @ip6-connlimit-main { ip6 saddr and ffff:ffff:ffff:ffff:: ct count over 32 } counter name "per_source_rejects" reject with tcp reset
        ct mark set 0x1 accept
    }

    # Count connections synproxy hands on, whose SYN reaches nginx over loopback.
    chain input-web-loopback {
        tcp flags != syn accept
        add @ip-connlimit-main { ip saddr ct count over 32 } counter name "per_source_rejects" reject with tcp reset
        add @ip6-connlimit-main { ip6 saddr and ffff:ffff:ffff:ffff:: ct count over 32 } counter name "per_source_rejects" reject with tcp reset
        ct mark set 0x1 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
        ct state established,related accept
    }
}
