# Written by configure-logging when host.json sets system_journal to persistent.
# System, kernel and login messages stay on disk for 14 days, so a restart
# can be explained afterwards. 2G holds 14 days at about 100 MB a day.
# The attestation service logs to its own volatile namespace instead.
[Journal]
Storage=persistent
SystemMaxUse=2G
RuntimeMaxUse=160M
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
