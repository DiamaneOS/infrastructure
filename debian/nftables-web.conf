#!/usr/sbin/nft -f
# SPDX-License-Identifier: Apache-2.0
# Web role policy, rendered by activate-web-firewall. The per-source caps and
# synproxy follow GrapheneOS etc/nftables/nftables-network.conf, with two changes:
# a SYN that carries no MSS option, as the spoofed reflection SYNs do, goes to
# synproxy and so leaves no state and no count, and a connection synproxy hands on
# is counted on the loopback chain. A real client's SYN keeps the tracked path, so
# its window scaling, SACK, MSS and first round trip are unchanged.
destroy table inet filter
table inet filter {
    counter per_source_rejects {}
    counter synproxy_syns {}

    # New connections are counted at the SYN, on the tracked path and where synproxy hands them
    # on. The kernel no longer counts a connection once it is assured, as at its first ACK.
    set ip-connlimit-main {
        type ipv4_addr
        size {{conntrack_max}}
        flags dynamic
    }

    set ip6-connlimit-main {
        type ipv6_addr
        size {{conntrack_max}}
        flags dynamic
    }

    # Sources over the cap on the synproxy path, refused for 10 s. Only the loopback chain adds
    # them, and these sets carry no count: a lookup in the sets above counts the packet.
    set ip-over-cap {
        type ipv4_addr
        size 65536
        flags dynamic, timeout
        timeout 10s
    }

    set ip6-over-cap {
        type ipv6_addr
        size 65536
        flags dynamic, timeout
        timeout 10s
    }

    chain prerouting-raw {
        type filter hook prerouting priority raw; policy accept;
        # Tunnel packets from any source would otherwise fill the connection table.
        udp dport {{wireguard_port}} notrack accept
        iif != lo tcp dport { {{tcp_ports}} } tcp flags syn jump prerouting-web-syn
    }

    # A web SYN goes to synproxy, untracked, when it is a flood or carries no MSS option.
    # Every other SYN returns and stays tracked. synproxy_syns stays the flood signal, so the
    # counter is on the rate rule alone and an option-less SYN below the rate does not raise it.
    chain prerouting-web-syn {
        limit rate over {{synproxy_threshold}}/second burst {{synproxy_threshold}} packets counter name "synproxy_syns" notrack accept
        # Option-less SYNs look like the spoofed reflection SYNs. A real client always sends an MSS.
        tcp option maxseg missing notrack accept
    }

    chain input {
        type filter hook input priority filter; policy drop;
        iifname != "wg-mgmt" tcp dport { {{tcp_ports}} } goto input-web
        ct state established,related accept
        ct state invalid drop
        iif lo accept
        include "/etc/diamaneos/management.nft"
        udp dport {{wireguard_port}} ct state untracked accept
        meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
        # Keep path MTU and error signalling working. Discovery is link-local, and
        # routed packets cannot legitimately arrive with hop limit 255.
        meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 20/second accept
        meta l4proto ipv6-icmp ip6 hoplimit 255 ip6 saddr fe80::/10 icmpv6 type nd-router-advert accept
        meta l4proto ipv6-icmp ip6 hoplimit 255 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } accept
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
    }

    chain input-web {
        iif lo goto input-web-loopback

        # A tracked new connection counts at the SYN. For synproxy the SYN is untracked and the
        # first ACK is invalid: both fall through the vmap to the synproxy statement below.
        ct state vmap { established : accept, related : accept, new : goto input-web-new }

        ip saddr @ip-over-cap counter name "per_source_rejects" reject with tcp reset
        ip6 saddr and ffff:ffff:ffff:ffff:: @ip6-over-cap counter name "per_source_rejects" reject with tcp reset
        # The MSS fits the interface MTU, and the window scale must equal the kernel's own.
        meta nfproto ipv4 synproxy mss {{mss_ipv4}} wscale {{wscale}} timestamp sack-perm
        meta nfproto ipv6 synproxy mss {{mss_ipv6}} wscale {{wscale}} timestamp sack-perm
    }

    # Count a tracked new connection at the SYN: 32 per IPv4 address or IPv6 /64. This reset
    # reaches the client, as it is the client's own SYN, before any synproxy handshake.
    chain input-web-new {
        add @ip-connlimit-main { ip saddr ct count over 32 } counter name "per_source_rejects" reject with tcp reset
        add @ip6-connlimit-main { ip6 saddr and ffff:ffff:ffff:ffff:: ct count over 32 } counter name "per_source_rejects" reject with tcp reset
        accept
    }

    # Count a connection synproxy hands on, as its SYN reaches nginx over loopback: 32 per IPv4
    # address or IPv6 /64, the same sets. Only a client that answered a cookie reaches here.
    chain input-web-loopback {
        tcp flags != syn accept
        add @ip-connlimit-main { ip saddr ct count over 32 } goto input-web-over-cap
        add @ip6-connlimit-main { ip6 saddr and ffff:ffff:ffff:ffff:: ct count over 32 } goto input-web-over-cap
        accept
    }

    # The client ignores this reset, as synproxy completed its handshake with other sequence
    # numbers. Its next packet gets a reset through the set. That is often a window probe some
    # seconds later (macOS waits about 5 s), as synproxy's handshake left it a zero window.
    chain input-web-over-cap {
        add @ip-over-cap { ip saddr }
        add @ip6-over-cap { ip6 saddr and ffff:ffff:ffff:ffff:: }
        counter name "per_source_rejects" reject with tcp reset
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
        ct state established,related accept
    }
}
