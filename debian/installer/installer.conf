# The web installer on its own origin, from DiamaneOS/installer web/nginx.
# installer-base.conf, installer-page.conf and installer-general.conf are its
# base.conf, installer.conf and general.conf. When nothing is published under
# /srv/diamaneos-installer/current, every path answers 404.

server {
    listen 80;
    listen [::]:80;
    server_name install.diamaneos.de;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/webroot;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name install.diamaneos.de;
    ssl_certificate /etc/letsencrypt/live/diamaneos-installer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-installer/privkey.pem;
    root /srv/diamaneos-installer/current;
    absolute_redirect off;
    autoindex off;
    disable_symlinks on from=$document_root;
    access_log off;
    error_log /dev/null crit;
    client_body_timeout 5s;
    client_header_timeout 5s;
    # The http block's keepalive_timeout 0 ends each HTTP/2 connection after one
    # request, and browsers then give up on some of the page's modules.
    keepalive_requests 64;
    keepalive_timeout 15s;
    # Browsers refuse a module served with another type.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json map;
    }
    default_type text/plain;
    charset utf-8;

    if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }

    # add_header in a location drops the server's, so each location includes all.
    location = / {
        include installer-base.conf;
        include installer-page.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        include installer-base.conf;
        include installer-page.conf;
        add_header Cache-Control "no-cache";
    }

    # Versioned by the fastboot.js commit in the path.
    location /js/fastboot/ {
        include installer-base.conf;
        include installer-general.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include installer-base.conf;
        include installer-general.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
