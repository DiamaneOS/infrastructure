# The MTA-STS policy for mail to diamaneos.de (RFC 8461). The mail provider is
# mailbox.org. Any change to the policy needs a new id in the _mta-sts TXT record.

server {
    listen 80;
    listen [::]:80;
    server_name mta-sts.diamaneos.de;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/webroot;
        try_files $uri =404;
    }
    location / { return 301 https://mta-sts.diamaneos.de$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mta-sts.diamaneos.de;
    ssl_certificate /etc/letsencrypt/live/diamaneos-mta-sts/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-mta-sts/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    client_body_timeout 5s;
    client_header_timeout 5s;
    # Locations add no headers, so these apply to every response.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        return 200 "version: STSv1\nmode: testing\nmx: *.mailbox.org\nmax_age: 86400\n";
    }

    location / { return 404; }
}
