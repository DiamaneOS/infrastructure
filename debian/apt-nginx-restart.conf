// A package upgrade leaves nginx running the code it replaced. This starts the check that restarts nginx
// on the new code, without waiting for it and without failing the package run.
DPkg::Post-Invoke {
    "/usr/bin/systemctl --no-block --quiet start nginx-binary-restart.service 2>/dev/null || true";
};
